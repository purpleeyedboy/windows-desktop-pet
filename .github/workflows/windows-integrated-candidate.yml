name: Windows all-feature integrated candidate

on:
  pull_request:
    branches: ['codex-od26j1']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install reproducible runtime and release tools
        run: python -m pip install . 'Pillow==11.3.0' 'fonttools==4.59.2' 'pytest==8.4.2' 'PyInstaller==6.22.3'
      - name: Verify shared ownership and safe integrated file transactions
        run: >-
          python -m pytest -q
          tests/test_integrated_runtime.py tests/test_integrated_release.py
          tests/test_integrated_pointer.py tests/test_activity_recovery_reentrancy.py
          tests/test_foundation_animation.py tests/test_ear_interaction.py
          tests/test_ear_touch_recoil.py tests/test_paw_press.py
          tests/test_paw_compositor.py tests/test_win32_pointer.py
          tests/test_hunger.py tests/test_hunger_runtime.py
          tests/test_hunger_feedback.py tests/test_hunger_animation.py
          tests/test_hunger_window_integration.py tests/test_expectation_exit_recovery.py
          tests/test_expectation_feedback.py tests/test_feed_core.py
          tests/test_feed_core_revision.py tests/test_feed_wiring.py
          tests/test_feed_confirmation_preference.py tests/test_feed_animation.py
          tests/test_windows_drop_target.py
      - name: Reconstruct all feature frames and verify 158 immutable assets
        run: python tools/prepare_integrated_release.py
      - name: Compile integrated source
        run: python -m compileall -q src run_integrated_pet.py
      - name: Build exactly one integrated Windows EXE
        run: python -m PyInstaller --noconfirm --workpath build/integrated-pyinstaller --distpath dist-integrated desktop_pet_integrated.spec
      - name: Verify every packaged feature resource and module
        run: python tools/verify_integrated_archive.py 'dist-integrated/桌面宠物_全部功能合并测试版_20260915.exe'
      - name: Verify native isolated startup without recycling any files
        shell: pwsh
        run: ./tools/smoke_test_integrated_candidate.ps1
      - name: Verify exact filename and digest
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem -LiteralPath dist-integrated -Filter *.exe -File)
          if ($exes.Count -ne 1 -or $exes[0].Name -ne '桌面宠物_全部功能合并测试版_20260915.exe') { throw 'Incorrect integrated artifact' }
          $hash = Get-FileHash -LiteralPath $exes[0].FullName -Algorithm SHA256
          "Size: $($exes[0].Length); SHA256: $($hash.Hash)" | Write-Output
          'Windows automated startup verified; user interaction and visual acceptance remain pending.' | Write-Output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 桌面宠物_全部功能合并测试版_20260915
          path: dist-integrated/桌面宠物_全部功能合并测试版_20260915.exe
          if-no-files-found: error
          retention-days: 30
