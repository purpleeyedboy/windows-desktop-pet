name: Windows runtime recovery regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Test cancellation, timeout and preemption recovery
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_activity_recovery_reentrancy.py -v
