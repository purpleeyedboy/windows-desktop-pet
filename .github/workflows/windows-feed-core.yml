name: Windows FEED-CORE candidate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feed-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.11'}
      - run: python -m pip install ".[dev]" -r requirements-assets.txt
      - run: python -m pytest -q tests/test_feed_core.py tests/test_feed_core_revision.py tests/test_windows_recycle_contract.py tests/test_feed_core_packaging.py
      - run: .\build_feed_core.ps1
        shell: pwsh
      - name: Verify frozen feed_core archive and simulation self-test
        shell: pwsh
        run: |
          python tools/verify_feed_core_archive.py 'dist-feed-core/桌面宠物_文件喂食与回收站事务.exe'
          $report=Join-Path $env:RUNNER_TEMP 'feed-core-frozen-self-test.json'
          & 'dist-feed-core/桌面宠物_文件喂食与回收站事务.exe' --self-test-output $report
          Get-Content -LiteralPath $report
      - name: Verify unique EXE, size and SHA256
        shell: pwsh
        run: |
          $exes=@(Get-ChildItem dist-feed-core -Filter *.exe -File)
          if ($exes.Count -ne 1) { throw "Expected exactly one EXE; found $($exes.Count)" }
          if ($exes[0].Name -ne '桌面宠物_文件喂食与回收站事务.exe') { throw "Unexpected EXE" }
          $hash=Get-FileHash $exes[0].FullName -Algorithm SHA256
          "size: $($exes[0].Length) bytes`nSHA256: $($hash.Hash)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-pet-v2.1-feed-core-candidate
          path: dist-feed-core/桌面宠物_文件喂食与回收站事务.exe
          if-no-files-found: error
