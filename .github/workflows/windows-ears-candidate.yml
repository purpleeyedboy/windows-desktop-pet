name: Windows V2.1 ears candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-ears-candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install ".[dev]" -r requirements-assets.txt
      - run: python -m pytest -q
      - run: python tools/build_ears_preview.py --output $env:RUNNER_TEMP/ears-preview.png
      - run: .\build_ears_candidate.ps1 -SkipTests
        shell: pwsh
      - name: Verify unique EXE and publish size and SHA-256
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem -LiteralPath dist-ears-candidate -Filter *.exe -File)
          if ($exes.Count -ne 1) { throw "Expected exactly one EXE; found $($exes.Count)." }
          if ($exes[0].Name -ne '桌面宠物_双耳点击反馈.exe') { throw "Unexpected EXE: $($exes[0].Name)" }
          $hash = Get-FileHash -LiteralPath $exes[0].FullName -Algorithm SHA256
          "Size: $($exes[0].Length) bytes`nSHA-256: $($hash.Hash)" | Tee-Object -FilePath "$env:GITHUB_STEP_SUMMARY" -Append
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-pet-v2-1-ears-test
          path: dist-ears-candidate/桌面宠物_双耳点击反馈.exe
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-pet-v2-1-ears-preview
          path: ${{ runner.temp }}/ears-preview.png
          retention-days: 7
          if-no-files-found: error
