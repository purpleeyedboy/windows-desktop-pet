name: Windows V2.1 ears candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-ears-candidate:
    runs-on: windows-latest
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install test and packaging dependencies
        run: python -m pip install "pytest>=8,<9" "Pillow>=11,<12" "fonttools>=4.59,<5" "PyInstaller>=6,<7"
      - name: Verify dual-ear input and interruption contracts
        run: >-
          python -m pytest -q
          tests/test_ear_interaction.py
          tests/test_ear_touch_recoil.py
          tests/test_foundation_animation.py
          tests/test_layered_window.py
          tests/test_window.py::test_headless_ear_press_release_is_independent_from_actions_and_restores
          tests/test_window.py::test_headless_ear_pointer_leave_focus_loss_and_close_restore_neutral
          tests/test_window.py::test_headless_each_ear_requires_press_and_release_on_the_same_ear
          tests/test_window.py::test_headless_ear_release_after_pointer_leave_is_ignored
          tests/test_window.py::test_headless_ear_animation_interruptions_restore_exact_neutral
      - name: Build Windows acceptance candidate
        env:
          V21_FOUNDATION_COMMIT: 1a18477faa4caa28170e648437d7cb8b39612ac0
        run: .\build_ears_candidate.ps1
        shell: pwsh
      - name: Verify isolated Windows candidate startup
        run: .\tools\smoke_test_ears_candidate.ps1
        shell: pwsh
      - name: Verify unique EXE, exact name, size and SHA-256
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem -LiteralPath dist-ears-candidate -Filter *.exe -File)
          if ($exes.Count -ne 1) { throw "Expected exactly one EXE; found $($exes.Count)." }
          if ($exes[0].Name -ne '桌面宠物_耳朵防触摸系统_单次躲闪-20260910.exe') { throw "Unexpected EXE: $($exes[0].Name)" }
          if ($exes[0].Length -gt 52428800) { throw "Candidate exceeds 50 MiB: $($exes[0].Length) bytes." }
          $hash = Get-FileHash -LiteralPath $exes[0].FullName -Algorithm SHA256
          "## 已通过双耳自动化回归的 Windows 实机验收候选版`n`n文件：$($exes[0].Name)`n大小：$($exes[0].Length) bytes`nSHA-256：$($hash.Hash)`n状态：构建与自动化通过不代表 Windows 实机或视觉验收；等待用户验收。" | Tee-Object -FilePath "$env:GITHUB_STEP_SUMMARY" -Append
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-pet-v2-1-ears-untested-windows-candidate
          path: dist-ears-candidate/桌面宠物_耳朵防触摸系统_单次躲闪-20260910.exe
          retention-days: 7
          if-no-files-found: error
