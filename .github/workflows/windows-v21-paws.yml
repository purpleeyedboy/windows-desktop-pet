name: Windows V2.1 PAWS untested candidate
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  build-untested-candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install runtime packager only (no test dependencies)
        run: >-
          python -m pip install
          "Pillow>=11,<12"
          "fonttools>=4.59,<5"
          "PyInstaller>=6,<7"
      - name: Build untested candidate
        shell: powershell
        run: .\build_paws.ps1
      - name: Verify sole candidate name, size and SHA-256
        shell: powershell
        run: |
          $exes = @(Get-ChildItem dist -Filter *.exe -File)
          if ($exes.Count -ne 1) { throw "Expected exactly one EXE" }
          if ($exes[0].Name -ne '桌面宠物_双前肢按压鼠标.exe') { throw "Unexpected EXE" }
          [PSCustomObject]@{
            Candidate = 'UNTESTED - pending user Windows acceptance'
            Name = $exes[0].Name
            Length = $exes[0].Length
            SHA256 = (Get-FileHash -Algorithm SHA256 $exes[0].FullName).Hash
          } | Format-List
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2.1-paws-untested-windows-candidate
          path: dist/桌面宠物_双前肢按压鼠标.exe
          if-no-files-found: error
