name: Windows V2.1 PAWS candidate
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install ".[dev]" -r requirements-assets.txt
      - run: python -m pytest -q
      - run: python tools/v21_paws_gate.py
      - shell: powershell
        run: |
          $preview = Join-Path $env:RUNNER_TEMP 'v2.1-paws-preview.png'
          python tools/generate_paws_preview.py $preview
          "preview-path=$preview" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        id: paws-preview
      - shell: powershell
        run: .\build_paws.ps1
      - shell: powershell
        run: |
          $exes = @(Get-ChildItem dist -Filter *.exe -File)
          if ($exes.Count -ne 1) { throw "Expected exactly one EXE" }
          if ($exes[0].Name -ne '桌面宠物_双前肢按压鼠标.exe') { throw "Unexpected EXE" }
          $exes[0] | Select-Object Name, Length
          Get-FileHash -Algorithm SHA256 $exes[0].FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2.1-paws-windows-candidate
          path: dist/桌面宠物_双前肢按压鼠标.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2.1-paws-preview
          path: ${{ steps.paws-preview.outputs.preview-path }}
          if-no-files-found: error
