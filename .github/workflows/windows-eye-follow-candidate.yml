name: Windows eye-follow candidate

on:
  pull_request:
    branches:
      - codex/head-neck-continuous-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-eye-follow-candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install ".[dev]" -r requirements-assets.txt
      - run: python -c 'import PIL; assert PIL.__version__.split(".", 1)[0] == "11", PIL.__version__'
      - run: python -m pytest -q
      - run: .\build_eye_follow_candidate.ps1 -SkipTests
        shell: pwsh
      - name: Verify unique EXE and publish SHA-256
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem -LiteralPath dist-eye-follow-candidate -Filter *.exe -File)
          if ($exes.Count -ne 1) { throw "Expected exactly one EXE; found $($exes.Count)." }
          if ($exes[0].Name -ne '桌面宠物_最终素材与转头角度基线修正版.exe') { throw "Unexpected EXE: $($exes[0].Name)" }
          $hash = Get-FileHash -LiteralPath $exes[0].FullName -Algorithm SHA256
          "SHA-256: $($hash.Hash)" | Tee-Object -FilePath "$env:GITHUB_STEP_SUMMARY" -Append
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-pet-v2-1-baseline
          path: dist-eye-follow-candidate/桌面宠物_最终素材与转头角度基线修正版.exe
          retention-days: 7
          if-no-files-found: error
