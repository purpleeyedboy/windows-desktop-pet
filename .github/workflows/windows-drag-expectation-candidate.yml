name: Windows drag expectation candidate

on:
  pull_request:
    branches:
      - codex/-v2.1
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  windows-drag-expectation-candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install . "PyInstaller>=6,<7"
      - run: .\build_drag_expectation_candidate.ps1 -SkipTests
        shell: pwsh
      - name: Verify unique EXE, size, and publish SHA-256
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem -LiteralPath dist-drag-expectation-candidate -Filter *.exe -File)
          if ($exes.Count -ne 1) { throw "Expected exactly one EXE; found $($exes.Count)." }
          if ($exes[0].Name -ne '桌面宠物_文件拖动期待反馈.exe') { throw "Unexpected EXE: $($exes[0].Name)" }
          if ($exes[0].Length -gt 52428800) { throw "EXE exceeds 50 MiB." }
          $hash = Get-FileHash -LiteralPath $exes[0].FullName -Algorithm SHA256
          "Automated tests: NOT RUN" | Tee-Object -FilePath "$env:GITHUB_STEP_SUMMARY" -Append
          "Awaiting user Windows acceptance" | Tee-Object -FilePath "$env:GITHUB_STEP_SUMMARY" -Append
          "SHA-256: $($hash.Hash)" | Tee-Object -FilePath "$env:GITHUB_STEP_SUMMARY" -Append
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-pet-v2-1-drag-expectation
          path: dist-drag-expectation-candidate/桌面宠物_文件拖动期待反馈.exe
          retention-days: 7
          if-no-files-found: error
